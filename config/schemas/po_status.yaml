po_status:
  exception_type: vendor_delay

  vendor_delay:
    status:
      type: string
      enum:
        - detected
        - acknoledged
        - resolved
        - cancelled
      required: true

    po_number:
      type: integer
      required: true

    vendor_id:
      type: string
      required: true

    excepted_delivery_date:
      type: date
      required: true

    revised_delivery_date:
      type: date
      required: false

    delay_days:
      type: integer
      minimum: 0
      required: true

    reason: 
      type: string
      required: true

    detected_at:
      type: datetime 
      required: true

    resolved_at: 
      type: datetime 
      required: false

agent_state:
  owner: procurement_agent
  status: waiting
  next_agent: vendor_followup_agent
  reason: awaiting_vendor_confirmation

tasks:
  - id: send_followup_email
    status: pending
    priority: high

  - id: update_erp
    status: blocked
    depends_on:
      - vendor_confirmation

memory: 
  vendor_last_contact: "2026-07-18T10:30:00Z"
  followup_count: 1

decisions: 
  retry_allowed: true
  max_retries: 3
  escalation_after_days: 2

Required Columns:
  - po_id
  - material_id
  - material_name
  - description
  - quantity
  - supplier
  - criticality_level
  - current_stock
  - reorder_point
  - lead_time_days
  - unit_cost
  - currency
  - location
  - risk_level
  - alternative_material
  - alternative_supplier
  - order_date
  - expected_delivery_date
  - actual_delivery_date
  - status