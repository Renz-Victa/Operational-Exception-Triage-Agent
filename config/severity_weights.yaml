severity_scoring:
  method: weighted_average

incident_evaluation:
  composite_severity:
      severity_weights:
        security:
          privilege_escalation: 90
          exploitability: 30

        reliability:
          service_outage: 90
          confidence: 20

        compliance: 
          pii_exposure: 95
          exposed_secret: 90
          data_sensitivity: 20

        quality: 
          failing_tests: 70
          business_impact: 40

        maintainability:
          duplicate_supply: 40
          asset_criticality: 15

      thresholds:
        critical: 
          min: 90
        high: 
          min: 70
        medium: 
          min: 50
        low: 
          min: 20